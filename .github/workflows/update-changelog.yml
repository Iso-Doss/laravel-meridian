name: "Update Changelog"

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      # Inserts the release notes verbatim (changelog-updater-action rewrites
      # the Markdown and breaks fenced code blocks).
      - name: Update Changelog
        env:
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          export RELEASE_DATE="${RELEASE_DATE%%T*}"
          python3 .github/scripts/update-changelog.py CHANGELOG.md

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: Update CHANGELOG
          file_pattern: CHANGELOG.md
